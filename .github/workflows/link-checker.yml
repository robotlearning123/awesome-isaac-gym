name: Link Checker

on:
  # Run weekly on Sundays at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - '**.md'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  link-check:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore lychee cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-

      - name: Run lychee link checker
        id: lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --verbose
            --no-progress
            --accept 100..=399
            --timeout 30
            --max-retries 3
            --max-concurrency 10
            --cache
            --max-cache-age 1d
            --exclude-mail
            --exclude '^https://www\.linkedin\.com'
            --exclude '^https://linkedin\.com'
            --exclude '^https://twitter\.com'
            --exclude '^https://x\.com'
            --exclude '^https://arxiv\.org/abs'
            --exclude '^https://arxiv\.org/pdf'
            --exclude '^https://github\.com/.*/blob/'
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            README.md
            CONTRIBUTING.md
          output: ./lychee-report.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload link check report
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: ./lychee-report.md
          retention-days: 30

      - name: Check for broken links and create issue
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const reportPath = './lychee-report.md';

            let reportContent = '';
            if (fs.existsSync(reportPath)) {
              reportContent = fs.readFileSync(reportPath, 'utf8');
            }

            // Check if there's an existing open issue for broken links
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'broken-link',
              per_page: 1
            });

            const runId = process.env.RUN_ID;
            const issueBody = `## Broken Links Detected

            The automated link checker has found broken links in the repository.

            **Run Date:** ${new Date().toISOString().split('T')[0]}
            **Workflow Run:** [View Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId})

            ### Report

            <details>
            <summary>Click to expand full report</summary>

            \`\`\`
            ${reportContent.substring(0, 60000)}
            \`\`\`

            </details>

            ---

            Please review and fix the broken links or update the exclusion list if these are false positives.

            *This issue was automatically created by the Link Checker workflow.*`;

            if (existingIssues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssues.data[0].number,
                body: issueBody
              });
              console.log(`Updated existing issue #${existingIssues.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Broken Links Detected',
                body: issueBody,
                labels: ['broken-link', 'automated']
              });
              console.log('Created new issue for broken links');
            }
